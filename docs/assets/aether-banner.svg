<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="1280" height="360" role="img" aria-labelledby="aether-hero-title aether-hero-desc">
  <title id="aether-hero-title">AETHER — Intelligence Through Evidence</title>
  <desc id="aether-hero-desc">Editorial midnight architectural hero banner for AETHER depicting an orbital provenance emblem, Rust Edition 2024 positioning, and a layered schematic separating deterministic execution, structural contract checks, and independent scientific validation.</desc>
  <defs>
    <linearGradient id="canvas-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05080F"/>
      <stop offset="50%" stop-color="#09111E"/>
      <stop offset="100%" stop-color="#0E1728"/>
    </linearGradient>
    <radialGradient id="ambient-cyan" cx="22%" cy="48%" r="42%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.14"/>
      <stop offset="65%" stop-color="#0EA5E9" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#05080F" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ambient-violet" cx="82%" cy="54%" r="44%">
      <stop offset="0%" stop-color="#818CF8" stop-opacity="0.16"/>
      <stop offset="55%" stop-color="#38BDF8" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#05080F" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wordmark-fill" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="60%" stop-color="#E0F2FE"/>
      <stop offset="100%" stop-color="#7DD3FC"/>
    </linearGradient>
    <linearGradient id="ring-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67E8F9"/>
      <stop offset="52%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>
    <linearGradient id="flow-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0.85"/>
    </linearGradient>
    <pattern id="lab-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="0.65" stroke-opacity="0.5"/>
    </pattern>
    <pattern id="fine-dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="0.8" fill="#334155" fill-opacity="0.55"/>
    </pattern>
  </defs>

  <!-- Primary Obsidian Frame -->
  <rect x="4" y="4" width="1272" height="352" rx="20" fill="url(#canvas-bg)" stroke="#1E293B" stroke-width="1.5"/>
  <rect x="4" y="4" width="1272" height="352" rx="20" fill="url(#lab-grid)" opacity="0.45"/>
  <rect x="640" y="20" width="620" height="320" rx="14" fill="url(#fine-dots)" opacity="0.6"/>
  <rect x="4" y="4" width="1272" height="352" rx="20" fill="url(#ambient-cyan)"/>
  <rect x="4" y="4" width="1272" height="352" rx="20" fill="url(#ambient-violet)"/>

  <!-- Precision Architectural Corner Ticks & Rules -->
  <g stroke="#334155" stroke-width="1" opacity="0.75">
    <path d="M 28 40 L 28 24 L 44 24" fill="none"/>
    <path d="M 1236 24 L 1252 24 L 1252 40" fill="none"/>
    <path d="M 28 320 L 28 336 L 44 336" fill="none"/>
    <path d="M 1236 336 L 1252 336 L 1252 320" fill="none"/>
  </g>
  <line x1="60" y1="28" x2="1220" y2="28" stroke="#1E3A5F" stroke-width="0.75" stroke-opacity="0.55"/>
  <line x1="60" y1="332" x2="1220" y2="332" stroke="#1E3A5F" stroke-width="0.75" stroke-opacity="0.55"/>

  <!-- Top Telemetry Spec Header -->
  <text x="58" y="48" fill="#64748B" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" letter-spacing="1.8">AETHER · RESEARCH ENGINEERING PLATFORM</text>
  <text x="1220" y="48" text-anchor="end" fill="#475569" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" letter-spacing="1.4">DETERMINISM != TRUTH · ZERO SELF-GRADING</text>

  <!-- Left Orbital Astrolabe & Provenance Prism -->
  <g transform="translate(106, 174)">
    <circle cx="0" cy="0" r="56" fill="#07101F" stroke="#1E3A5F" stroke-width="1.2"/>
    <circle cx="0" cy="0" r="46" fill="none" stroke="#334155" stroke-width="1" stroke-dasharray="2 6"/>
    <circle cx="0" cy="0" r="39" fill="none" stroke="url(#ring-accent)" stroke-width="1.6" stroke-dasharray="22 8 6 8"/>
    <ellipse cx="0" cy="0" rx="52" ry="18" transform="rotate(-28)" fill="none" stroke="#38BDF8" stroke-opacity="0.45" stroke-width="1.15"/>
    <ellipse cx="0" cy="0" rx="52" ry="18" transform="rotate(28)" fill="none" stroke="#A78BFA" stroke-opacity="0.4" stroke-width="1.15"/>
    <line x1="-64" y1="0" x2="-48" y2="0" stroke="#38BDF8" stroke-opacity="0.5" stroke-width="1"/>
    <line x1="48" y1="0" x2="64" y2="0" stroke="#A78BFA" stroke-opacity="0.5" stroke-width="1"/>
    <polygon points="0,-22 19,12 -19,12" fill="#0B192E" stroke="#E0F2FE" stroke-width="1.8" stroke-linejoin="round"/>
    <line x1="0" y1="-22" x2="0" y2="12" stroke="#38BDF8" stroke-opacity="0.45" stroke-width="1"/>
    <circle cx="0" cy="-22" r="3.6" fill="#67E8F9"/>
    <circle cx="19" cy="12" r="3.6" fill="#60A5FA"/>
    <circle cx="-19" cy="12" r="3.6" fill="#A78BFA"/>
    <circle cx="0" cy="1" r="2.8" fill="#F8FAFC"/>
  </g>

  <!-- Central Editorial Wordmark & Positioning -->
  <g transform="translate(192, 96)">
    <text x="0" y="0" fill="#67E8F9" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" font-weight="700" letter-spacing="2.8">INTELLIGENCE THROUGH EVIDENCE</text>

    <text x="-3" y="64" fill="url(#wordmark-fill)" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="64" font-weight="800" letter-spacing="7">AETHER</text>

    <text x="0" y="96" fill="#CBD5E1" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17.5" font-weight="500">Evidence-grounded Research OS for reproducible discovery.</text>

    <!-- Restrained Architecture Pills -->
    <g transform="translate(0, 122)">
      <rect x="0" y="0" width="142" height="28" rx="6" fill="#0B1526" stroke="#253852" stroke-width="1"/>
      <text x="71" y="18" text-anchor="middle" fill="#93C5FD" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5">Rust Edition 2024</text>

      <rect x="152" y="0" width="144" height="28" rx="6" fill="#0B1526" stroke="#253852" stroke-width="1"/>
      <text x="224" y="18" text-anchor="middle" fill="#7DD3FC" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5">SHA-256 Ledger</text>

      <rect x="306" y="0" width="150" height="28" rx="6" fill="#121329" stroke="#4338CA" stroke-opacity="0.65" stroke-width="1"/>
      <text x="381" y="18" text-anchor="middle" fill="#C4B5FD" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5">Deny-by-Default</text>
    </g>

    <text x="0" y="182" fill="#64748B" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="0.4">6 Rust Crates · SQLite Provenance · Loopback API · React 19 UI</text>
  </g>

  <!-- Right Precision Schematic: Epistemic & Execution Architecture -->
  <g transform="translate(694, 58)">
    <rect x="0" y="0" width="538" height="248" rx="14" fill="#070D18" fill-opacity="0.92" stroke="#1E293B" stroke-width="1.2"/>

    <!-- Panel Title Bar -->
    <text x="20" y="25" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="600" letter-spacing="1.4">VERIFICATION &amp; EPISTEMIC BOUNDARY</text>
    <circle cx="514" cy="21" r="4" fill="#22D3EE"/>
    <text x="502" y="25" text-anchor="end" fill="#67E8F9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10">local-first</text>
    <line x1="18" y1="36" x2="520" y2="36" stroke="#1E293B" stroke-width="1"/>

    <!-- Orthogonal & Curved Signal Flows -->
    <path d="M 148 84 L 194 84" fill="none" stroke="url(#flow-cyan)" stroke-width="1.8"/>
    <polygon points="194,84 187,80 187,88" fill="#60A5FA"/>
    <path d="M 332 84 L 378 84" fill="none" stroke="url(#flow-cyan)" stroke-width="1.8"/>
    <polygon points="378,84 371,80 371,88" fill="#818CF8"/>

    <!-- Epistemic Boundary Line separating deterministic check from scientific validation -->
    <line x1="20" y1="138" x2="518" y2="138" stroke="#334155" stroke-width="1" stroke-dasharray="5 4"/>
    <rect x="174" y="128" width="190" height="19" rx="9" fill="#0B1322" stroke="#334155" stroke-width="0.9"/>
    <text x="269" y="141" text-anchor="middle" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" letter-spacing="0.8">EXPLICIT TRUTH GATE</text>

    <!-- Downward link from deterministic trace to independent gate -->
    <path d="M 263 114 L 263 128" fill="none" stroke="#475569" stroke-width="1.2" stroke-dasharray="3 3"/>
    <path d="M 263 147 L 263 162" fill="none" stroke="#A78BFA" stroke-opacity="0.7" stroke-width="1.3" stroke-dasharray="3 3"/>

    <!-- Node 1: Source Evidence -->
    <rect x="20" y="54" width="128" height="60" rx="9" fill="#0C172A" stroke="#38BDF8" stroke-opacity="0.65" stroke-width="1.2"/>
    <text x="32" y="75" fill="#67E8F9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="700">01 PROVENANCE</text>
    <text x="32" y="92" fill="#E2E8F0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11.5" font-weight="600">Archive + Graph</text>
    <text x="32" y="106" fill="#64748B" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5">UTF-8 byte spans</text>

    <!-- Node 2: Pure Rust Core -->
    <rect x="196" y="54" width="136" height="60" rx="9" fill="#0E1D35" stroke="#60A5FA" stroke-width="1.35"/>
    <text x="208" y="75" fill="#93C5FD" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="700">02 RUST KERNEL</text>
    <text x="208" y="92" fill="#F8FAFC" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11.5" font-weight="600">Bounded Replay</text>
    <text x="208" y="106" fill="#64748B" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5">forbid(unsafe_code)</text>

    <!-- Node 3: APO-11 Structural Check -->
    <rect x="380" y="54" width="138" height="60" rx="9" fill="#0B1F27" stroke="#2DD4BF" stroke-opacity="0.7" stroke-width="1.2"/>
    <text x="392" y="75" fill="#5EEAD4" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="700">03 APO-11 CHECKS</text>
    <text x="392" y="92" fill="#E2E8F0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11.5" font-weight="600">8 Fixed Rules</text>
    <text x="392" y="106" fill="#64748B" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5">structure only</text>

    <!-- Bottom Row: External Human & Held-Out Custody Gate -->
    <rect x="20" y="162" width="498" height="48" rx="9" fill="#131227" stroke="#818CF8" stroke-opacity="0.7" stroke-width="1.2"/>
    <text x="34" y="182" fill="#C4B5FD" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="700">04 SCIENTIFIC VALIDATION &amp; OWNER APPROVAL</text>
    <text x="34" y="199" fill="#CBD5E1" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11.5">External held-out custody + human review — never inferred from pass/fail shape checks</text>
    <text x="504" y="182" text-anchor="end" fill="#A78BFA" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10">not_performed</text>

    <!-- Panel Footer Legend -->
    <circle cx="26" cy="229" r="3.5" fill="#2DD4BF"/>
    <text x="36" y="233" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10">Implemented deterministic mechanics</text>
    <circle cx="294" cy="229" r="3.5" fill="#A78BFA"/>
    <text x="304" y="233" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10">Independent human / held-out authority</text>
  </g>
</svg>
