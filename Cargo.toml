[workspace]
resolver = "3"
members = [
    "crates/aether-api",
    "crates/aether-cli",
    "crates/aether-core",
    "crates/aether-engine",
    "crates/aether-runner",
    "crates/aether-store",
]
exclude = ["learning"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
aether-core = { path = "crates/aether-core" }
aether-engine = { path = "crates/aether-engine" }
aether-runner = { path = "crates/aether-runner" }
aether-store = { path = "crates/aether-store" }
axum = "0.8"
futures-util = "0.3"
rusqlite = { version = "0.43", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "net", "signal", "time"] }
ureq = { version = "3.5", features = ["json"] }
